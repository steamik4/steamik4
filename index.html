<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyshkin Bio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="header-box">
            <img src="header.png" alt="Header">
        </div>

        <!-- Кнопки -->
        <main class="main-content">
            <a href="https://t.me/your_channel" class="big-button">
                <div class="button-text">
                    <h2>Telegram Канал</h2>
                    <p>Перейти в наш канал</p>
                </div>
                <div class="button-img">
                    <img src="minion.png" alt="Миньон">
                </div>
            </a>

            <a href="https://t.me/GapcjikStars_bot" class="big-button">
                <div class="button-text">
                    <h2>Покупка Звезд</h2>
                    <p>Бот для быстрого пополнения</p>
                </div>
                <div class="button-img">
                    <img src="gengar.png" alt="Звездный бот">
                </div>
            </a>
        </main>

        <!-- Подвал -->
        <div class="footer-box">
            <img src="footer.png" alt="Footer">
        </div>
    </div>

</body>
</html>
