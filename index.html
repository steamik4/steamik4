<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio</title>
    <!-- Подключение шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumar+One&family=Oi&display=swap" rel="stylesheet">
    <!-- Подключение файла стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Шапка сайта -->
        <header class="header">
            <div class="header-overlay">
                <h1>MY BIO</h1>
            </div>
        </header>

        <main class="main-content">
            <!-- Блок со ссылками -->
            <section class="links-section">
                
                <!-- Ссылка 1: Основной Telegram -->
                <a href="https://t.me/your_username" class="link-card clickable">
                    <div class="text">
                        <h3>Telegram</h3>
                        <p>Основной аккаунт для связи</p>
                    </div>
                    <div class="circle-img">
                        <img src="img/телеграм.png" alt="Telegram" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </a>

                <!-- Ссылка 2: Ваш канал -->
                <a href="https://t.me/your_channel" class="link-card clickable">
                    <div class="text">
                        <h3>My Channel</h3>
                        <p>Наш Telegram канал</p>
                    </div>
                    <div class="circle-img">
                        <img src="img/канал.png" alt="Channel" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </a>

            </section>

            <!-- Блок со статистикой / отзывами -->
            <section class="stats-section">
                <div class="stat-bubble rating">
                    <span class="label-top-left">Рейтинг<br>продавца<br>5.0 из 5</span>
                    <div class="value-bottom-right">
                        <span class="reviews-count">100 отзывов</span>
                    </div>
                </div>

                <a href="https://t.me/your_shop" class="stat-bubble orders clickable">
                    <h3 class="label-top-left">the largest<br>orders</h3>
                    <span class="click-here value-bottom-right">КЛИКАТЬ ТУТ</span>
                </a>
            </section>
        </main>

        <!-- Блок с картинками-отзывами -->
        <section class="reviews-section">
            <div class="review-card-img">
               <img src="img/отзыв1.png" alt="Отзыв 1">
            </div>
            <div class="review-card-img">
              <img src="img/отзыв2.png" alt="Отзыв 2">
            </div>
            <div class="review-card-img">
               <img src="img/отзыв3.png" alt="Отзыв 3">
            </div>
        </section>
    </div>

</body>
</html>
