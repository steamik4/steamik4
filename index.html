<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyshkin Bio</title>
    <!-- Подключение шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oi&display=swap" rel="stylesheet">
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Шапка (город с названием) -->
        <header class="header">
            <img src="img/header.png" alt="Header" class="bg-img">
        </header>

        <!-- Основной контент (кнопки) -->
        <main class="main-content">
            
            <!-- Кнопка 1: Telegram канал -->
            <a href="https://t.me/your_channel" class="big-button">
                <div class="button-text">
                    <h2>Telegram Channel</h2>
                    <p>Join our community</p>
                </div>
                <div class="button-img">
                    <img src="img/minion.png" alt="Миньон">
                </div>
            </a>

            <!-- Кнопка 2: Бот для покупки звезд -->
            <a href="https://t.me/GapcjikStars_bot" class="big-button">
                <div class="button-text">
                    <h2>Buy Stars</h2>
                    <p>Fast Telegram stars bot</p>
                </div>
                <div class="button-img">
                    <img src="img/gengar.png" alt="Звездный бот">
                </div>
            </a>

        </main>

        <!-- Подвал сайта (с ветками и луной) -->
        <footer class="footer">
            <img src="img/footer.png" alt="Footer" class="bg-img">
        </footer>
    </div>

</body>
</html>
