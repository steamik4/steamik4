<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyshkin Bio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Эффект падающего снега на задний фон -->
    <div class="snow-container">
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
    </div>

    <!-- Боковые видео (видны только на ПК) -->
    <video src="left.mp4" autoplay muted loop playsinline class="side-video left-video"></video>
    <video src="right.mp4" autoplay muted loop playsinline class="side-video right-video"></video>

    <div class="container">
        <!-- Шапка -->
        <div class="header-wrap animate-in header-anim">
            <img src="header.png" alt="Lyshkin" class="header-img">
        </div>

        <!-- Основной контент (кнопки) -->
        <main class="main-content">
            <a href="https://t.me/your_channel" class="big-button animate-in btn-anim-1">
                <div class="button-text">
                    <h2>Telegram Канал</h2>
                    <p>Перейти в наш канал</p>
                </div>
                <div class="button-img">
                    <img src="minion.png" alt="Миньон">
                </div>
            </a>

            <a href="https://t.me/GapcjikStars_bot" class="big-button animate-in btn-anim-2">
                <div class="button-text">
                    <h2>Покупка Звезд</h2>
                    <p>Бот для быстрого пополнения</p>
                </div>
                <div class="button-img">
                    <img src="gengar.png" alt="Звездный бот">
                </div>
            </a>

            <a href="https://www.tiktok.com/@your_account" class="big-button animate-in btn-anim-3">
                <div class="button-text">
                    <h2>TikTok</h2>
                    <p>Смотреть новые ролики</p>
                </div>
                <div class="button-img">
                    <img src="tiktok.png" alt="TikTok">
                </div>
            </a>
        </main>

        <!-- Блок с информацией о навыках -->
        <div class="bio-card animate-in btn-anim-3">
            <h3>Обо мне & Навыки</h3>
            <p>Уверенный бэкенд-разработчик. Создаю собственные проекты на Python и автоматизирую процессы.</p>
            <div class="skills-tags">
                <span>C++</span>
                <span>C#</span>
                <span>JavaScript</span>
                <span>Flutter</span>
                <span>Python</span>
                <span>Kotlin</span>
                <span>Rust</span>
                <span>PHP</span>
                <span>Go</span>
            </div>
        </div>

        <!-- Подвал -->
        <div class="footer-wrap animate-in footer-anim">
            <img src="footer.png" alt="Footer" class="footer-img">
        </div>
    </div>

</body>
</html>
