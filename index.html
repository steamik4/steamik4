<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyshkin Bio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка через тег img, чтобы она никогда не обрезалась -->
    <div class="header-wrap">
        <img src="header.png" alt="Lyshkin" class="header-img">
    </div>

    <!-- Основной контент (по центру) -->
    <div class="container">
        <main class="main-content">
            <a href="https://t.me/your_channel" class="big-button">
                <div class="button-text">
                    <h2>Telegram Канал</h2>
                    <p>Перейти в наш канал</p>
                </div>
                <div class="button-img">
                    <img src="minion.png" alt="Миньон">
                </div>
            </a>

            <a href="https://t.me/GapcjikStars_bot" class="big-button">
                <div class="button-text">
                    <h2>Покупка Звезд</h2>
                    <p>Бот для быстрого пополнения</p>
                </div>
                <div class="button-img">
                    <img src="gengar.png" alt="Звездный бот">
                </div>
            </a>
        </main>
    </div>

    <!-- Подвал через тег img -->
    <div class="footer-wrap">
        <img src="footer.png" alt="Footer" class="footer-img">
    </div>

</body>
</html>
